 components built with Tailwind CSS and the Flowbite library featuring hero sections, headers, contact forms, and more."},"subcategorySlug":"faq","subcategory":{"id":"f4e8c93b-61cb-4f2f-8fb9-3460907a8cc8","title":"Tailwind CSS FAQ Sections - Flowbite","thumbnail":"FAQ Sections","description":"Get started with a collection of FAQ (frequently asked questions) sections to show a list of questions and answers to your website visitors and users.","seoTitle":"Tailwind CSS FAQ Sections - Flowbite","seoDescription":"Get started with a collection of FAQ (frequently asked questions) sections to show a list of questions and answers to your website visitors and users."},"blockTemplates":[{"id":"d7f26edf-bb63-403b-9a0c-f478cb2a00a3","categoryId":"f4e8c93b-61cb-4f2f-8fb9-3460907a8cc8","isFree":true,"isPublic":true,"title":"Default example","slug":"default","description":"Use this simple example of a FAQ section to show a list of questions and answers based on two columns and a question mark icon.","seoTitle":"Default example","seoDescription":"Use this simple example of a FAQ section to show a list of questions and answers based on two columns and a question mark icon.","seoIndex":false,"requiresJs":false,"sortingNumber":1,"iframeClasses":null,"createdAt":"2022-06-19T14:40:31.362Z","updatedAt":"2023-01-31T13:49:27.749Z","content":{"html":"\u003csection class=\"bg-white dark:bg-gray-900\"\u003e\n  \u003cdiv class=\"py-8 px-4 mx-auto max-w-screen-xl sm:py-16 lg:px-6\"\u003e\n      \u003ch2 class=\"mb-8 text-4xl tracking-tight font-extrabold text-gray-900 dark:text-white\"\u003eFrequently asked questions\u003c/h2\u003e\n      \u003cdiv class=\"grid pt-8 text-left border-t border-gray-200 md:gap-16 dark:border-gray-700 md:grid-cols-2\"\u003e\n          \u003cdiv\u003e\n              \u003cdiv class=\"mb-10\"\u003e\n                  \u003ch3 class=\"flex items-center mb-4 text-lg font-medium text-gray-900 dark:text-white\"\u003e\n                      \u003csvg class=\"flex-shrink-0 mr-2 w-5 h-5 text-gray-500 dark:text-gray-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                      What do you mean by \"Figma assets\"?\n                  \u003c/h3\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eYou will have access to download the full Figma project including all of the pages, the components, responsive pages, and also the icons, illustrations, and images included in the screens.\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"mb-10\"\u003e                        \n                  \u003ch3 class=\"flex items-center mb-4 text-lg font-medium text-gray-900 dark:text-white\"\u003e\n                      \u003csvg class=\"flex-shrink-0 mr-2 w-5 h-5 text-gray-500 dark:text-gray-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                      What does \"lifetime access\" exactly mean?\n                  \u003c/h3\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eOnce you have purchased either the design, code, or both packages, you will have access to all of the future updates based on the roadmap, free of charge.\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"mb-10\"\u003e\n                  \u003ch3 class=\"flex items-center mb-4 text-lg font-medium text-gray-900 dark:text-white\"\u003e\n                      \u003csvg class=\"flex-shrink-0 mr-2 w-5 h-5 text-gray-500 dark:text-gray-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                      How does support work?\n                  \u003c/h3\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eWe're aware of the importance of well qualified support, that is why we decided that support will only be provided by the authors that actually worked on this project.\u003c/p\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eFeel free to \u003ca href=\"#\" class=\"font-medium underline text-primary-600 dark:text-primary-500 hover:no-underline\" target=\"_blank\" rel=\"noreferrer\"\u003econtact us\u003c/a\u003e and we'll help you out as soon as we can.\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"mb-10\"\u003e\n                  \u003ch3 class=\"flex items-center mb-4 text-lg font-medium text-gray-900 dark:text-white\"\u003e\n                      \u003csvg class=\"flex-shrink-0 mr-2 w-5 h-5 text-gray-500 dark:text-gray-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                      I want to build more than one project. Is that allowed?\n                  \u003c/h3\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eYou can use Windster for an unlimited amount of projects, whether it's a personal website, a SaaS app, or a website for a client. As long as you don't build a product that will directly compete with Windster either as a UI kit, theme, or template, it's fine.\u003c/p\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eFind out more information by \u003ca href=\"#\" class=\"font-medium underline text-primary-600 dark:text-primary-500 hover:no-underline\"\u003ereading the license\u003c/a\u003e.\u003c/p\u003e\n              \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n              \u003cdiv class=\"mb-10\"\u003e\n                  \u003ch3 class=\"flex items-center mb-4 text-lg font-medium text-gray-900 dark:text-white\"\u003e\n                      \u003csvg class=\"flex-shrink-0 mr-2 w-5 h-5 text-gray-500 dark:text-gray-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                      What does \"free updates\" include?\n                  \u003c/h3\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eThe free updates that will be provided is based on the \u003ca href=\"#\" class=\"font-medium underline text-primary-600 dark:text-primary-500 hover:no-underline\"\u003eroadmap\u003c/a\u003e that we have laid out for this project. It is also possible that we will provide extra updates outside of the roadmap as well.\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"mb-10\"\u003e\n                  \u003ch3 class=\"flex items-center mb-4 text-lg font-medium text-gray-900 dark:text-white\"\u003e\n                      \u003csvg class=\"flex-shrink-0 mr-2 w-5 h-5 text-gray-500 dark:text-gray-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                      What does the free version include?\n                  \u003c/h3\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eThe \u003ca href=\"#\" class=\"font-medium underline text-primary-600 dark:text-primary-500 hover:no-underline\"\u003efree version\u003c/a\u003e of Windster includes a minimal style guidelines, component variants, and a dashboard page with the mobile version alongside it.\u003c/p\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eYou can use this version for any purposes, because it is open-source under the MIT license.\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"mb-10\"\u003e\n                  \u003ch3 class=\"flex items-center mb-4 text-lg font-medium text-gray-900 dark:text-white\"\u003e\n                      \u003csvg class=\"flex-shrink-0 mr-2 w-5 h-5 text-gray-500 dark:text-gray-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                      What is the difference between Windster and Tailwind UI?\n                  \u003c/h3\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eAlthough both Windster and Tailwind UI are built for integration with Tailwind CSS, the main difference is in the design, the pages, the extra components and UI elements that Windster includes.\u003c/p\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eAdditionally, Windster is a project that is still in development, and later it will include both the application, marketing, and e-commerce UI interfaces.\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"mb-10\"\u003e\n                  \u003ch3 class=\"flex items-center mb-4 text-lg font-medium text-gray-900 dark:text-white\"\u003e\n                      \u003csvg class=\"flex-shrink-0 mr-2 w-5 h-5 text-gray-500 dark:text-gray-400\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                      Can I use Windster in open-source projects?\n                  \u003c/h3\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eGenerally, it is accepted to use Windster in open-source projects, as long as it is not a UI library, a theme, a template, a page-builder that would be considered as an alternative to Windster itself.\u003c/p\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eWith that being said, feel free to use this design kit for your open-source projects.\u003c/p\u003e\n                  \u003cp class=\"text-gray-500 dark:text-gray-400\"\u003eFind out more information by \u003ca href=\"#\" class=\"font-medium underline text-primary-600 dark:text-primary-500 hover:no-underline\"\u003ereading the license\u003c/a\u003e.\u003c/p\u003e\n              \u003c/div\u003e\n          \u003c/div\u003e\n      \u003c/div\u003e\n  \u003c/div\u003e\n\u                      \u003cp class=\"rD4HtsUG_hahmbh2Kj09 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eFlowbite is an open-source library of interactive components built on top of Tailwind CSS including buttons, dropdowns, modals, navbars, and more.\u003c/p\u003e\n                        \u003cp class=\"K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eCheck out this guide to learn how to \u003ca href=\"#\" class=\"text-primary-600 dark:text-primary-500 _5zvlMLkN1qETxEl3IhT\"\u003eget started\u003c/a\u003e and start developing websites even faster with components on top of Tailwind CSS.\u003c/p\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n                \u003ch2 id=\"accordion-flush-heading-2\"\u003e\n                    \u003cbutton type=\"button\" class=\"kqgYncRJQ7spwKfig6It _T15kfOPGkvwZnqhqKce neyUwteEn7DOg9pBSJJE _HWADNS2701qmy_ajlg3 jCISvWkW5oStPH6Wrb_H _A6LflweZRUwrcL6M2Tk PJD8Rj8ZmfldJGExe8Fx K1PPCJwslha8GUIvV_Cr umaBek2qJLzF9vdDPtgc pxHuWvF853ck68OLN6ef JeVit_1klYopnNwu_8oy eCx_6PNzncAD5yo7Qcic\" data-accordion-target=\"#accordion-flush-body-2\" aria-expanded=\"false\" aria-controls=\"accordion-flush-body-2\"\u003e\n                        \u003cspan\u003eIs there a Figma file available?\u003c/span\u003e\n                        \u003csvg data-accordion-icon=\"\" class=\"nLhohPz5FpffXM9RSdFT _XD2a764x49B1E2F9f8X zujhCQXfQfsYXApYjSOW\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                    \u003c/button\u003e\n                \u003c/h2\u003e\n                \u003cdiv id=\"accordion-flush-body-2\" class=\"j2x7_17hqRVmwte_tWFa\" aria-labelledby=\"accordion-flush-heading-2\"\u003e\n                    \u003cdiv class=\"_HWADNS2701qmy_ajlg3 umaBek2qJLzF9vdDPtgc pxHuWvF853ck68OLN6ef JeVit_1klYopnNwu_8oy\"\u003e\n                        \u003cp class=\"rD4HtsUG_hahmbh2Kj09 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eFlowbite is first conceptualized and designed using the Figma software so everything you see in the library has a design equivalent in our Figma file.\u003c/p\u003e\n                        \u003cp class=\"K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eCheck out the \u003ca href=\"#\" class=\"text-primary-600 dark:text-primary-500 _5zvlMLkN1qETxEl3IhT\"\u003eFigma design system\u003c/a\u003e based on the utility classes from Tailwind CSS and components from Flowbite.\u003c/p\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n                \u003ch2 id=\"accordion-flush-heading-3\"\u003e\n                    \u003cbutton type=\"button\" class=\"kqgYncRJQ7spwKfig6It _T15kfOPGkvwZnqhqKce neyUwteEn7DOg9pBSJJE _HWADNS2701qmy_ajlg3 jCISvWkW5oStPH6Wrb_H _A6LflweZRUwrcL6M2Tk PJD8Rj8ZmfldJGExe8Fx K1PPCJwslha8GUIvV_Cr umaBek2qJLzF9vdDPtgc pxHuWvF853ck68OLN6ef JeVit_1klYopnNwu_8oy eCx_6PNzncAD5yo7Qcic\" data-accordion-target=\"#accordion-flush-body-3\" aria-expanded=\"false\" aria-controls=\"accordion-flush-body-3\"\u003e\n                        \u003cspan\u003eWhat are the differences between Flowbite and Tailwind UI?\u003c/span\u003e\n                        \u003csvg data-accordion-icon=\"\" class=\"nLhohPz5FpffXM9RSdFT _XD2a764x49B1E2F9f8X zujhCQXfQfsYXApYjSOW\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                    \u003c/button\u003e\n                \u003c/h2\u003e\n                \u003cdiv id=\"accordion-flush-body-3\" class=\"j2x7_17hqRVmwte_tWFa\" aria-labelledby=\"accordion-flush-heading-3\"\u003e\n                    \u003cdiv class=\"_HWADNS2701qmy_ajlg3 umaBek2qJLzF9vdDPtgc pxHuWvF853ck68OLN6ef JeVit_1klYopnNwu_8oy\"\u003e\n                        \u003cp class=\"rD4HtsUG_hahmbh2Kj09 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eThe main difference is that the core components from Flowbite are open source under the MIT license, whereas Tailwind UI is a paid product. Another difference is that Flowbite relies on smaller and standalone components, whereas Tailwind UI offers sections of pages.\u003c/p\u003e\n                        \u003cp class=\"rD4HtsUG_hahmbh2Kj09 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eHowever, we actually recommend using both Flowbite, Flowbite Pro, and even Tailwind UI as there is no technical reason stopping you from using the best of two worlds.\u003c/p\u003e\n                        \u003cp class=\"rD4HtsUG_hahmbh2Kj09 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eLearn more about these technologies:\u003c/p\u003e\n                        \u003cul class=\"fF8rgOnW6c5_84KFva_4 _6E6wM9ePQTdBsbopBu4 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003e\n                            \u003cli\u003e\u003ca href=\"#\" class=\"text-primary-600 dark:text-primary-500 _5zvlMLkN1qETxEl3IhT\"\u003eFlowbite Pro\u003c/a\u003e\u003c/li\u003e\n                            \u003cli\u003e\u003ca href=\"#\" class=\"text-primary-600 dark:text-primary-500 _5zvlMLkN1qETxEl3IhT\"\u003eTailwind UI\u003c/a\u003e\u003c/li\u003e\n                        \u003c/ul\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n                \u003ch2 id=\"accordion-flush-heading-4\"\u003e\n                    \u003cbutton type=\"button\" class=\"kqgYncRJQ7spwKfig6It _T15kfOPGkvwZnqhqKce neyUwteEn7DOg9pBSJJE _HWADNS2701qmy_ajlg3 jCISvWkW5oStPH6Wrb_H _A6LflweZRUwrcL6M2Tk PJD8Rj8ZmfldJGExe8Fx K1PPCJwslha8GUIvV_Cr umaBek2qJLzF9vdDPtgc pxHuWvF853ck68OLN6ef JeVit_1klYopnNwu_8oy eCx_6PNzncAD5yo7Qcic\" data-accordion-target=\"#accordion-flush-body-4\" aria-expanded=\"false\" aria-controls=\"accordion-flush-body-4\"\u003e\n                        \u003cspan\u003eWhat about browser support?\u003c/span\u003e\n                        \u003csvg data-accordion-icon=\"\" class=\"nLhohPz5FpffXM9RSdFT _XD2a764x49B1E2F9f8X zujhCQXfQfsYXApYjSOW\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\u003cpath fill-rule=\"evenodd\" d=\"M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z\" clip-rule=\"evenodd\"\u003e\u003c/path\u003e\u003c/svg\u003e\n                    \u003c/button\u003e\n                \u003c/h2\u003e\n                \u003cdiv id=\"accordion-flush-body-4\" class=\"j2x7_17hqRVmwte_tWFa\" aria-labelledby=\"accordion-flush-heading-4\"\u003e\n                    \u003cdiv class=\"_HWADNS2701qmy_ajlg3 umaBek2qJLzF9vdDPtgc pxHuWvF853ck68OLN6ef JeVit_1klYopnNwu_8oy\"\u003e\n                        \u003cp class=\"rD4HtsUG_hahmbh2Kj09 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eThe main difference is that the core components from Flowbite are open source under the MIT license, whereas Tailwind UI is a paid product. Another difference is that Flowbite relies on smaller and standalone components, whereas Tailwind UI offers sections of pages.\u003c/p\u003e\n                        \u003cp class=\"rD4HtsUG_hahmbh2Kj09 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eHowever, we actually recommend using both Flowbite, Flowbite Pro, and even Tailwind UI as there is no technical reason stopping you from using the best of two worlds.\u003c/p\u003e\n                        \u003cp class=\"rD4HtsUG_hahmbh2Kj09 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eLearn more about these technologies:\u003c/p\u003e\n                        \u003cul class=\"fF8rgOnW6c5_84KFva_4 _6E6wM9ePQTdBsbopBu4 K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003e\n                            \u003cli\u003e\u003ca href=\"#\" class=\"text-primary-600 dark             \u003cdiv\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        What do you mean by \"Figma assets\"?\n                    \u003c/h3\u003e\n                    \u003cp class=\"K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eYou will have access to download the full Figma project including all of the pages, the components, responsive pages, and also the icons, illustrations, and images included in the screens.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e                        \n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        What does \"lifetime access\" exactly mean?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eOnce you have purchased either the design, code, or both packages, you will have access to all of the future updates based on the roadmap, free of charge.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        How does support work?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eWe're aware of the importance of well qualified support, that is why we decided that support will only be provided by the authors that actually worked on this project.\u003c/p\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eFeel free to \u003ca href=\"#\" class=\"_A6LflweZRUwrcL6M2Tk vjxcH6oRcT32j4R9BxSq text-primary-600 dark:text-primary-500 _LWmEJ3ddClfhUowkba_\" target=\"_blank\" rel=\"noreferrer\"\u003econtact us\u003c/a\u003e and we'll help you out as soon as we can.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        I want to build more than one project with Flowbite. Is that allowed?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eYou can use Flowbite for an unlimited amount of projects, whether it's a personal website, a SaaS app, or a website for a client. As long as you don't build a product that will directly compete with Flowbite either as a UI kit, theme, or template, it's fine.\u003c/p\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eFind out more information by \u003ca href=\"#\" class=\"_A6LflweZRUwrcL6M2Tk vjxcH6oRcT32j4R9BxSq text-primary-600 dark:text-primary-500 _LWmEJ3ddClfhUowkba_\"\u003ereading the license\u003c/a\u003e.\u003c/p\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        What does \"free updates\" include?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eThe free updates that will be provided is based on the \u003ca href=\"#\" class=\"_A6LflweZRUwrcL6M2Tk vjxcH6oRcT32j4R9BxSq text-primary-600 dark:text-primary-500 _LWmEJ3ddClfhUowkba_\"\u003eroadmap\u003c/a\u003e that we have laid out for this project. It is also possible that we will provide extra updates outside of the roadmap as well.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        What does the free version include?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eThe \u003ca href=\"#\" class=\"_A6LflweZRUwrcL6M2Tk vjxcH6oRcT32j4R9BxSq text-primary-600 dark:text-primary-500 _LWmEJ3ddClfhUowkba_\"\u003efree version\u003c/a\u003e of Flowbite includes a minimal style guidelines, component variants, and a dashboard page with the mobile version alongside it.\u003c/p\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eYou can use this version for any purposes, because it is open-source under the MIT license.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        What is the difference between Flowbite and Tailwind UI?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eAlthough both Flowbite and Tailwind UI are built for integration with Tailwind CSS, the main difference is in the design, the pages, the extra components and UI elements that Flowbite includes.\u003c/p\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eAdditionally, Flowbite is a project that is still in development, and later it will include both the application, marketing, and e-commerce UI interfaces.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        Can I use Flowbite in open-source projects?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eGenerally, it is accepted to use Flowbite in open-source projects, as long as it is not a UI library, a theme, a template, a page-builder that would be considered as an alternative to Flowbite itself.\u003c/p\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eWith that being said, feel free to use this design kit for your open-source projects.\u003c/p\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eFind out more information by \u003ca href=\"#\" class=\"_A6LflweZRUwrcL6M2Tk vjxcH6oRcT32j4R9BxSq text-primary-600 dark:text-primary-500 _LWmEJ3ddClfhUowkba_\"\u003ereading the license\u003c/a\u003e.\u003c/p\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        When will I get access to the Tailwind CSS code if I pre-ordered it?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eThe official date that we have set out to release the code version of Flowbite is the \u003cspan class=\"_A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH\"\u003e25th of September, 2021\u003c/span\u003e. We are already working on the integration and if you have a pre-order, you will also get frequent updates about the progress.\u003c/p\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eYou'll be one of the first to know when it will be available.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        What is your refund policy?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eIf you are unhappy with your purchase, just \u003ca href=\"#\" class=\"_A6LflweZRUwrcL6M2Tk vjxcH6oRcT32j4R9BxSq text-primary-600 dark:text-primary-500 _LWmEJ3ddClfhUowkba_\" target=\"_blank\" rel=\"noreferrer\"\u003econtact us\u003c/a\u003e within 30 days and we'll issue a full refund.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        Is it allowed to use the design assets, such as the fonts, icons, and illustrations?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eWhat you see is what you get. Which means that all icons, fonts, and illustrations can be used based on the licensing that we researched or purchased. For example, we purchased rights to use the illustrations in Flowbite.\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"nWZf98ol6C_zfYzOT9TH\"\u003e\n                    \u003ch3 class=\"_9OKVeTXzfSwD_NYO6_G VwrSTsh__so52zqMJvws _A6LflweZRUwrcL6M2Tk g3OYBOqwXUEW4dRGogkH a0Ed69aMSu0vgf4oysz0\"\u003e\n                        Where can I access my download files?\n                    \u003c/h3\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eAfter you purchased one of the plans, you will get two emails: one for the invoice, and another one with the download files.\u003c/p\u003e\n                    \u003cp class=\"_9OKVeTXzfSwD_NYO6_G K1PPCJwslha8GUIvV_Cr eCx_6PNzncAD5yo7Qcic\"\u003eSoon we will create a way that you will be able to access the download files from the Flowbite dashboard from this website.\u003c/p\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\u003c/section\u003e","htmlHeaderPostMetadata":null,"htmlHeaderPreMetadata":null,"htmlBodyPostMetadata":null,"htmlBodyPreMetadata":null,"js":"","cssUrls":["https://d2s3ptptdai04x.cloudfront.net/get-flowbite-pro.38fe7c89-3043-4f0a-82f6-09d719d2ac65.css?Expires=2033974753\u0026Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly9kMnMzcHRwdGRhaTA0eC5jbG91ZGZyb250Lm5ldC9nZXQtZmxvd2JpdGUtcHJvLjM4ZmU3Yzg5LTMwNDMtNGYwYS04MmY2LTA5ZDcxOWQyYWM2NS5jc3MiLCJDb25kaXRpb24iOnsiRGF0ZUxlc3NUaGFuIjp7IkFXUzpFcG9jaFRpbWUiOjIwMzM5NzQ3NTN9fX1dfQ__\u0026Signature=c5OhlMyiyTq9QXEQ9z5-ch-7XcZoGaeuwy7H6LckYztJajWHhh9jPj6dMIOJR6gIH5ueA7evu9CCTAliu08ArQKb6XT9dDQhVbVkSVgHH7keBbRlmxz1Ux2gZgZOP6ii2NiViCXVSehSnEn0GXAc9lj0Wl0vCCdIm8gIqQJ8Y-nz9iewA93T8m0OCuhTgduLQJst-r-ayflNXRyLEJA7TlP9xVqLLIbMDg-YBLSiKnB0AooRfzgHeJFe9PU2Cjjc1sUcRmweuAikyMqQT05Xl~WTqBCDKRNXRHKc-NV4onWC8XmdRCNeZxZYFjMM7auHHqeXDO7IM0IGO8VXmI4sPg__\u0026Key-Pair-Id=K2J5W1U51CTOXP"],"jsUrls":[],"urlsExpireAt":"2034-06-15T08:59:13.281Z","darkClassName":"_neKTiNR9ODo9dbROzCM"}},{"id":"5a839103-7233-407f-81e2-d7f1916ac262","categoryId":"f4e8c93b-61cb-4f2f-8fb9-3460907a8cc8","isF
